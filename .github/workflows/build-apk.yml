name: Build Android APK

# Manual trigger (GitHub UI → Actions → Build Android APK → Run workflow)
# yoki har bir push'da avtomatik (main branch).
#
# Build natija — `hearak-debug.apk` artifact'i sifatida 90 kun saqlanadi.
# Aktions tab'idan yuklab olib telefonga o'rnatish mumkin.

on:
  push:
    branches: [main]
    paths:
      - "hearek/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: hearek

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: hearek/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build SPA bundle (APK mode)
        run: npm run build:apk

      - name: Capacitor sync to Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: hearek/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p ../artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk ../artifacts/hearak-debug.apk
          ls -la ../artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hearak-android-apk
          path: artifacts/hearak-debug.apk
          retention-days: 90
          if-no-files-found: error
