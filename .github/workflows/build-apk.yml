name: Build Android APK

# v2.1: gh release CLI ishlatilgan (softprops/action-gh-release ichki bug bo'lganidan).
# Push (main) yoki manual trigger'da APK quriladi.
#
# Natijalar:
#   1. `hearak-android-apk` artifact (Actions tab → 90 kun saqlanadi)
#   2. `apk-latest` Release (har push'da yangilanadi) — APK to'g'ridan-to'g'ri
#      yuklanadi, ZIP'siz, Windows Defender false-positive bo'lmaydi.

on:
  push:
    branches: [main]
    paths:
      - "hearek/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

concurrency:
  group: apk-build
  cancel-in-progress: true

permissions:
  contents: write # softprops/action-gh-release uchun

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: hearek

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: hearek/package-lock.json

      - name: Setup JDK 21
        # Capacitor 7 plugin'lari Java 21 source release talab qiladi
        # ("invalid source release: 21" xatosi 17 da chiqadi).
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build SPA bundle (APK mode)
        run: npm run build:apk

      - name: Capacitor sync to Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: hearek/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p ../artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk ../artifacts/hearak.apk
          ls -la ../artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hearak-android-apk
          path: artifacts/hearak.apk
          retention-days: 90
          if-no-files-found: error

      # APK'ni Release sifatida ham yuklab qo'yamiz — bu yo'l Windows Defender
      # tomonidan false-positive bo'lmaydi (ZIP qo'shilmaydi). Telefondan
      # to'g'ridan-to'g'ri yuklab olish mumkin.
      #
      # `softprops/action-gh-release@v2` ba'zan "account suspended" xatosi
      # qaytarardi (action ichki bug). Buning o'rniga `gh release` CLI'ni
      # ishlatamiz — Ubuntu runnerda o'rnatilgan, GITHUB_TOKEN avtomatik.
      - name: Publish to "apk-latest" Release
        working-directory: hearek
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: |
            Hearak Android ilovasi — har push'da yangilanadigan so'nggi versiya.

            **Yuklab olish:** pastdagi `hearak.apk` faylini bevosita yuklab oling
            va Android telefoningizda oching.

            Commit: ${{ github.sha }}
            Build sanasi: ${{ github.event.head_commit.timestamp }}
        run: |
          set -e
          APK=../artifacts/hearak.apk
          test -f "$APK"
          # Mavjud release bo'lsa, asset'ni almashtirib qo'yamiz (clobber).
          # Bo'lmasa, yangidan yaratamiz.
          if gh release view apk-latest >/dev/null 2>&1; then
            echo "Updating existing release apk-latest"
            gh release upload apk-latest "$APK" --clobber
            gh release edit apk-latest \
              --title "Hearak APK (so'nggi)" \
              --notes "$BODY"
          else
            echo "Creating new release apk-latest"
            gh release create apk-latest "$APK" \
              --title "Hearak APK (so'nggi)" \
              --notes "$BODY"
          fi
