name: Deploy Marja Market frontend

# Marja Market (TanStack Start SPA) ni VPS'ga deploy qiladi.
# Trigger: main'ga push (faqat hearak-your-child-s-hearing-journey/** o'zgarganda)
#          yoki qo'lda GitHub UI orqali (workflow_dispatch).
#
# Talab qilingan secrets (Settings → Secrets and variables → Actions):
#   - VPS_HOST     — server IP yoki domain (masalan 1.2.3.4)
#   - VPS_USER     — SSH foydalanuvchi (masalan root yoki deploy)
#   - VPS_PASSWORD — SSH paroli
#   - VPS_PORT     — SSH port (masalan 22 yoki 2222)
#
# Server tomonda kerakli holatlar (initial setup):
#   - /var/www/marja/ — nginx tomonidan static fayllarni servisga olib boriladigan papka
#   - nginx server block marja.yourdomain.com (yoki IP) uchun:
#       root /var/www/marja/current;
#       location / { try_files $uri $uri/ /index.html; }
#   - Foydalanuvchi $VPS_USER /var/www/marja ga yozish huquqiga ega bo'lishi kerak
#     (yoki sudo bilan ishlaydi).

on:
  push:
    branches: [main]
    paths:
      - "hearak-your-child-s-hearing-journey/**"
      - ".github/workflows/deploy-marja.yml"
  workflow_dispatch:

concurrency:
  group: marja-deploy
  cancel-in-progress: false

env:
  APP_DIR: hearak-your-child-s-hearing-journey
  REMOTE_BASE: /var/www/marja

jobs:
  build:
    name: Build SPA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('hearak-your-child-s-hearing-journey/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        working-directory: ${{ env.APP_DIR }}
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: bun run build

      - name: Pack artifact
        run: |
          cd "${APP_DIR}/dist"
          tar -czf "$GITHUB_WORKSPACE/marja-dist.tar.gz" client
          ls -lh "$GITHUB_WORKSPACE/marja-dist.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: marja-dist
          path: marja-dist.tar.gz
          retention-days: 7

  deploy:
    name: SSH deploy → ${{ secrets.VPS_HOST }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: marja-dist

      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Pre-flight — secrets present
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          missing=()
          [ -z "$VPS_HOST" ]     && missing+=(VPS_HOST)
          [ -z "$VPS_USER" ]     && missing+=(VPS_USER)
          [ -z "$VPS_PASSWORD" ] && missing+=(VPS_PASSWORD)
          [ -z "$VPS_PORT" ]     && missing+=(VPS_PORT)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}"
            exit 1
          fi
          echo "All VPS_* secrets present."

      - name: Upload bundle via SCP
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          sshpass -e scp \
            -P "$VPS_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            marja-dist.tar.gz "$VPS_USER@$VPS_HOST:/tmp/marja-dist.tar.gz"

      - name: Atomic swap + nginx reload
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          REMOTE_BASE: ${{ env.REMOTE_BASE }}
          GIT_SHA: ${{ github.sha }}
        run: |
          sshpass -e ssh \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            "$VPS_USER@$VPS_HOST" \
            "REMOTE_BASE='$REMOTE_BASE' GIT_SHA='$GIT_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          echo "::group::Marja deploy on $(hostname)"

          RELEASE_DIR="$REMOTE_BASE/releases/$(date +%Y%m%d-%H%M%S)-${GIT_SHA:0:7}"
          mkdir -p "$RELEASE_DIR"

          echo "→ extracting bundle to $RELEASE_DIR"
          tar -xzf /tmp/marja-dist.tar.gz -C "$RELEASE_DIR"
          # tar contained ./client/* — flatten so RELEASE_DIR contains index.html directly
          if [ -d "$RELEASE_DIR/client" ]; then
            mv "$RELEASE_DIR/client/"* "$RELEASE_DIR/client/".[!.]* "$RELEASE_DIR/" 2>/dev/null || true
            rmdir "$RELEASE_DIR/client" 2>/dev/null || true
          fi
          rm -f /tmp/marja-dist.tar.gz

          echo "→ atomic symlink swap → current"
          ln -sfn "$RELEASE_DIR" "$REMOTE_BASE/current"

          echo "→ prune old releases (keep 5)"
          cd "$REMOTE_BASE/releases"
          ls -1t | tail -n +6 | xargs -r rm -rf

          echo "→ nginx reload (best-effort)"
          if command -v nginx >/dev/null 2>&1; then
            (sudo nginx -t && sudo systemctl reload nginx) \
              || (nginx -t && systemctl reload nginx) \
              || echo "::warning::nginx reload skipped (no permission or not installed)"
          fi

          echo "DEPLOY_OK release=$RELEASE_DIR"
          echo "::endgroup::"
          REMOTE

      - name: Smoke-test (HTTP from runner)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set +e
          echo "Checking http://$VPS_HOST/ ..."
          code=$(curl -fsS -o /dev/null -w "%{http_code}" --max-time 15 "http://$VPS_HOST/" || echo "000")
          echo "  HTTP $code"
          # Don't hard-fail if domain isn't pointed yet — deploy already succeeded above.
          if [ "$code" != "200" ] && [ "$code" != "000" ]; then
            echo "::warning::Got HTTP $code from http://$VPS_HOST/ — check nginx config."
          fi
